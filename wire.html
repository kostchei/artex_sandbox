// Tickets are illustrative scenario events; severity is estimated, not a CVSS score.
const socTickets = new Map();
let socLooping = false;
function renderSocTickets() {
  const cards = document.getElementById('soc-cards');
  const tickets = [...socTickets.values()];
  cards.replaceChildren();
  const loop = socLooping && tickets.length > 3;
  cards.classList.toggle('looping', loop);
  cards.style.setProperty('--soc-loop-duration', `${Math.max(24, tickets.length * 5)}s`);
  cards.style.transform = loop ? '' : `translateY(-${Math.max(0, tickets.length - 3) * 42}px)`;
  const displayed = loop ? [...tickets, ...tickets] : tickets;
  displayed.forEach((ticket, index) => {
    const card = document.createElement('div');
    card.className = 'soc-card';
    if (index >= tickets.length) card.setAttribute('aria-hidden', 'true');
    const head = document.createElement('div'); head.className = 'soc-card-head';
    const title = document.createElement('span'); title.className = 'soc-title'; title.textContent = ticket.title;
    const severity = document.createElement('span'); severity.className = 'soc-severity'; severity.textContent = ticket.severity;
    const detail = document.createElement('div'); detail.className = 'soc-detail'; detail.textContent = ticket.detail;
    head.append(title, severity); card.append(head, detail); cards.appendChild(card);
  });
}

function getDefaultNodeBadge(asset, findings) {
  if (!findings.length) {
    return { code: 'NO FINDING', title: 'No finding recorded; security status is unknown' };
  }
  const f = findings[0];
  if (f.category === 'external_misconfiguration') {
    return { code: 'EXTERNAL MISCONFIGURATION', title: f.title };
  }
  if (f.kind === 'cve') {
    return { code: `${f.cveId}${f.inKev ? ' · KEV' : ''}`, title: f.title };
  }
  if (f.kind === 'diagnostic_access') {
    return { code: f.title.toUpperCase(), title: 'Signed-in diagnostics viewer' };
  }
  if (f.kind === 'anonymous_access') {
    return { code: `${f.technique} · PUBLIC`, title: f.title };
  }
  if (f.kind === 'password_spray') {
    return { code: `${f.technique} · SPRAY`, title: f.mfaProtected ? 'MFA enforced' : 'No MFA/lockout' };
  }
  return { code: f.technique || 'FINDING', title: f.title };
}

function formatAssetTooltip(asset, findings, credentials) {
  const lines = [
    `${asset.label} (${asset.trustZone})`,
    `Interfaces: ${asset.interfaces.join(', ')}`
  ];
  if (asset.endpointCount) lines.push(`Fleet inventory: ${asset.endpointCount} endpoints; effects are limited by acquired endpoint scope.`);
  if (!findings.length) {
    lines.push('No finding recorded; security status is unknown.');
    if (asset.referenceCve) lines.push(`Product advisory reference: ${asset.referenceCve}`);
  } else {
    findings.forEach(f => {
      lines.push(`Finding: ${f.cveId ? f.cveId + ' · ' : ''}${f.title}`);
      if (f.historicalReference) lines.push(`Reference: ${f.historicalReference}`);
      if (f.sourceUrl) lines.push(`Source: ${f.sourceUrl} (reviewed ${f.sourceReviewed}).`);
    });
  }
  if (credentials.length) {
    credentials.forEach(c => {
      lines.push(c.startingAccess
        ? `Starting access: ${c.label} · ${c.scope}`
        : `Stored credential: ${c.label} (requires ${c.requiredSourceCapability})`);
      if(c.endpointScope)lines.push(`Account endpoint scope: ${c.endpointScope.length} endpoints`);
      if(c.sourceEndpointIds)lines.push(`Stored on endpoint: ${c.sourceEndpointIds.join(', ')}`);
    });
  }
  return lines.join('\n');
}

let estateOverview = { assetIds: new Set(), routeIds: new Set() };

function layoutGraph(estate) {
  const w = Math.max(1440, document.getElementById('viewport').clientWidth);
  const graphTop = 80;

  currentWires.clear();
  nodesLayer.innerHTML = '';
  svg.innerHTML = '';
  document.getElementById('viewport').classList.remove('illustration-active');

  const overviewRoutes = new Set(estate.overviewRouteIds || []);
  const overviewAssets = new Set();
  for (const route of estate.relationships) {
    if (!overviewRoutes.has(route.id)) continue;
    overviewAssets.add(route.sourceId);
    overviewAssets.add(route.targetId);
  }
  estateOverview = { assetIds: overviewAssets, routeIds: overviewRoutes };
  const displayedIds = new Set([...(discoveryPlan?.assetIds || estate.assets.map(a => a.id)), ...overviewAssets]);
  const displayedRelationships = new Set([...(discoveryPlan?.relationshipIds || estate.relationships.map(r => r.id)), ...overviewRoutes]);
  const nodes = estate.assets.filter(asset=>displayedIds.has(asset.id)).map(asset => {
    const displayLabel = asset.isDecoy ? `${asset.label} · Decoy` : asset.label;
    const findings = estate.findings.filter(f => f.assetId === asset.id);
    const creds = estate.credentials.filter(c => c.sourceAssetId === asset.id);
    return {
      ...asset,
      label: displayLabel,
      findings,
      creds,
      x: (asset.layerIdx + 0.5) * w / 4,
      y: graphTop,
      downstream: [],
      hit: false,
      defended: false,
      el: null
    };
  });

  currentNodes = new Map(nodes.map(node => [node.id, node]));
  estate.relationships.forEach(rel => {
    const source = currentNodes.get(rel.sourceId);
    const target = currentNodes.get(rel.targetId);
    if (!source || !target) return;
    source.downstream.push(target.id);
  });

  nodes.forEach(node => {
    const el = document.createElement('div');
    el.className = node.isDecoy ? 'node decoy' : 'node';
    el.id = 'node-' + node.id;
    el.tabIndex = 0;
    el.setAttribute('role', 'button');
    el.setAttribute('aria-label', node.label);
    if (node.referenceCve) el.dataset.appliance = node.groupId;
    el.title = `${node.label} (${node.trustZone})\nInterfaces: ${node.interfaces.join(', ')}\nFindings and stored credentials have not been observed.`;
    el.style.left = `${node.x}px`;
    el.style.top = `${node.y}px`;

    const badge = {code:node.isExternalEntry ? 'EXTERNAL SURFACE' : overviewAssets.has(node.id) ? 'ESTATE ASSET' : 'DISCOVERED ASSET',title:'No access established'};
    el.innerHTML = `
      <div class="node-icon-wrapper">
        <div class="node-halo"></div>
        <div class="node-icon"></div>
      </div>
      <div class="node-label">${node.label}</div>
      <div class="node-kev">
        <span class="cve">${badge.code}</span>
        <span class="vuln-title">${badge.title}</span>
      </div>
      <span class="node-state"></span>
    `;
    const selectNode = () => {
      revealNodeWires(node, 4000);
      const ns = run?.nodeStates?.[node.id];
      const evidenceTime = discoveryStarted ? modeledTime : -1;
      const whyLines = (ns?.why || []).filter(w => w.timeSec <= evidenceTime).map(w =>
        `Why [${w.outcome}${w.reasonCode ? ' · ' + w.reasonCode : ''}]: ${w.reason}${w.controlId ? ' (control: ' + w.controlId + ')' : ''}${w.scope ? ' [scope: ' + w.scope + ']' : ''}`
      );
      const extraWhy = whyLines.length ? `\n\n── Causal Inspection ("Why") ──\n${whyLines.join('\n')}` : '';
      const data = describeDatasetVolume(node, run.events.filter(event => event.timeSec <= evidenceTime));
      document.getElementById('asset-details').textContent = [node.el.title, data, extraWhy].filter(Boolean).join('\n');
    };
    el.addEventListener('click', selectNode);
    el.addEventListener('focus', selectNode);
    el.addEventListener('keydown', event => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); selectNode(); } });
    nodesLayer.appendChild(el);
    if (node.isDecoy && ['combined', 'canaries', 'soc-canary'].includes(defense)) {
      const marker = document.createElement('span');
      marker.className = 'canary-marker';
      marker.textContent = 'Canary deployed';
      el.appendChild(marker);
    }
    node.el = el;
  });

  document.getElementById('asset-details').textContent = '';
  estate.relationships.filter(rel=>displayedRelationships.has(rel.id)).forEach(rel => createWire(currentNodes.get(rel.sourceId), currentNodes.get(rel.targetId), rel));

  updateDiscoveredMap(modeledTime || 0);
  if (referenceCase) markReferenceFlow(estate, referenceCase);
  applyAssetSearch();
  renderAttackers(modeledTime || 0);
}

function markReferenceFlow(estate, { context, example }) {
  const flow = referenceServiceFlow(estate, context.groups);
  if (!flow) return;

  const isContextOnly = example?.referenceRole === 'context_only';
  const vendorToken = (example?.vendor || '').toLowerCase();
  const productToken = (example?.product || '').toLowerCase();
  flow.assets.forEach((id, index) => {
    const node = currentNodes.get(id);
    if (!node) return;
    const el = node.el;
    el.title += `\nReference KEV Context (${example?.referenceRole || 'context_only'}) · ${context.roles[index]}`;
    const labelLower = node.label.toLowerCase();
    const matchesVendor = !isContextOnly && (!vendorToken || labelLower.includes(vendorToken) || labelLower.includes(productToken) || node.groupId === example?.matchedGroupId);
    if (index === context.focus && matchesVendor) {
      el.classList.add('catalog-focus');
      el.title += `\n${context.defensiveFocus}`;
    }
  });
}

function updateDiscoveredMap(time) {
  if (!discoveryPlan) return;
  const view = RunDiscovery.at(discoveryPlan,time,discoveryStarted);
  const initial = new Set([...discoveryPlan.initialAssetIds, ...estateOverview.assetIds]);
  let changed = false;
  for (const node of currentNodes.values()) {
    const visible = view.known.has(node.id) || estateOverview.assetIds.has(node.id);
    if (node.el.hidden === visible) changed = true;
    node.el.hidden = !visible;
    node.el.tabIndex = visible ? 0 : -1;
  }
  const w = Math.max(1440,document.getElementById('viewport').clientWidth);
  const band = (w-100)/4;
  let bottom=80;
  if (new URLSearchParams(location.search).get('capture') !== 'path') {
    for(let layer=0;layer<4;layer++) {
      const lanes=[80,152];
      const known=[...currentNodes.values()].filter(n=>n.layerIdx===layer&&!n.el.hidden)
        .sort((a,b)=>Number(!initial.has(a.id))-Number(!initial.has(b.id)) || discoveryPlan.assetTimes[a.id]-discoveryPlan.assetTimes[b.id] || a.id.localeCompare(b.id));
      known.forEach((node,index)=>{
        const lane=index%2;
        node.x=50+layer*band+(lane ? .75 : .25)*band;node.y=lanes[lane];
        node.el.style.left=`${node.x}px`;node.el.style.top=`${node.y}px`;
        lanes[lane]+=200;
      });
      bottom=Math.max(bottom,...lanes);
    }
    const minimum=new URLSearchParams(location.search).has('embedded')?0:window.innerHeight;
    document.getElementById('viewport').style.height=`${Math.max(minimum,bottom+160)}px`;
  }
  const edges = new Set([...view.relationshipIds, ...estateOverview.routeIds]);
  for(const [id,wire] of currentWires) {
    wire.path.style.display=edges.has(id)&&!wire.source.el.hidden&&!wire.target.el.hidden?'':'none';
    wire.path.setAttribute('d',`M ${wire.source.x} ${wire.source.y} L ${wire.target.x} ${wire.target.y}`);
  }
  if(changed)applyAssetSearch();
}

function drawGitIllustration(proxy, width, y) {
  const steps = ['Git repository access', 'CI runner access', 'Higher-privilege runner', 'IdP admin access'];
  let previous = proxy;
  for (const [index, label] of steps.entries()) {
    const x = width * (0.29 + index * 0.18);
    const wire = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    wire.setAttribute('class', 'illustrative-wire');
    wire.setAttribute('d', `M ${previous.x} ${previous.y} L ${x} ${y}`);
    svg.appendChild(wire);

    const node = document.createElement('div');
    node.className = 'illustrative-step';
    node.style.left = `${x}px`;
    node.style.top = `${y}px`;
    node.title = `Illustrative branch · ${label}`;
    node.textContent = label;
    nodesLayer.appendChild(node);
    previous = { x, y };
  }
}

function createWire(source, target, relationship) {
  if (!source || !target) return;
  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  path.setAttribute('class', estateOverview.routeIds.has(relationship.id) ? 'wire estate-route' : 'wire');
  svg.appendChild(path);
  const wire = { source, target, path };
  path.setAttribute('d', `M ${source.x} ${source.y} L ${target.x} ${target.y}`);
  currentWires.set(relationship.id, wire);
}

function revealNodeWires(node, duration = 1200) {
  for (const wire of currentWires.values()) {
    if (wire.source.id !== node.id && wire.target.id !== node.id) continue;
    const revealId = (wire.revealId || 0) + 1;
    wire.revealId = revealId;
    wire.path.classList.add('revealed');
    setTimeout(() => {
      if (wire.revealId === revealId) wire.path.classList.remove('revealed');
    }, duration);
  }
}

const PROBE_MS = 340;

function formatEstimate(seconds) {
  if (seconds === 0) return 'At start';
  if (seconds < 60) return '<1 min';
  const minutes = Math.round(seconds / 60);
  const hours = Math.floor(minutes / 60);
  const remainder = minutes % 60;
  if (!hours) return `~${minutes} min`;
  return `~${hours} hr${remainder ? ` ${remainder} min` : ''}`;
}

function animatePulse(wire) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const ns = 'http://www.w3.org/2000/svg';
  const pulse = document.createElementNS(ns, 'circle');
  pulse.setAttribute('class', 'wire-packet');
  pulse.setAttribute('r', '3.5');
  const motion = document.createElementNS(ns, 'animateMotion');
  motion.setAttribute('path', wire.path.getAttribute('d'));
  motion.setAttribute('dur', '420ms');
  motion.setAttribute('begin', 'indefinite');
  motion.addEventListener('endEvent', () => pulse.remove(), { once: true });
  pulse.appendChild(motion);
  svg.appendChild(pulse);
  motion.beginElement();
}

function showProbes(events, laneCount) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return 0;
  const candidates = new Map(events.filter(event => !event.control && RunDiscovery.observed(event) && currentNodes.get(event.targetId)?.el.hidden === false)
    .map(event => [event.relationshipId ?? event.targetId, event]));
  let index = 0;
  for (const event of candidates.values()) {
    const target = currentNodes.get(event.targetId);
    const wire = currentWires.get(event.relationshipId);
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('class', 'probe-wire');
    path.setAttribute('d', wire
      ? wire.path.getAttribute('d')
      : `M 0 ${target.y} L ${target.x} ${target.y}`);

    path.dataset.lane = String(index % laneCount + 1);
    path.style.animationDelay = `${Math.floor(index++ / laneCount) * PROBE_MS}ms`;
    path.style.animationDuration = `${PROBE_MS}ms`;
    path.addEventListener('animationend', () => path.remove(), { once: true });
    svg.appendChild(path);
  }
  return Math.ceil(candidates.size / laneCount) * PROBE_MS;
}

function renderEvent(event, time, animate) {
  const node = currentNodes.get(event.targetId);
  if (!node || node.el.hidden || event.policySkipped) return;
  const wire = currentWires.get(event.relationshipId);
  const success = event.outcome === 'succeeded';
  const blocked = event.outcome === 'blocked';
  const contained = event.outcome === 'suppressed';
  const conditional = event.outcome === 'conditional';
  const incomplete = event.outcome === 'budget_exhausted';
  const alertOnly = event.outcome === 'alert_only' || event.grantedCapability === 'decoy_alert';
  const read = event.grantedCapability === 'data_read' && node.layerIdx === 3 && !node.isDecoy;
  const encrypted = success && event.actionKind === 'encryption';
  const persistent = success && event.actionKind === 'persistence';
  const phished = success && event.finding?.kind === 'phishing_attachment';
  const exported = success && event.actionKind === 'data_exfiltration';
  const staging = node.groupId === 'staging-status';
  const finding = event.finding;
  const diagnostic = finding?.kind === 'diagnostic_access';
  const reference = finding?.cveId || event.technique;
  const action = finding?.title || (event.credentialUsed ? 'Valid Accounts' : 'Access check');
  const summary = phished ? `Phishing attachment executed · ${reference}` : reference ? `${action} · ${reference}` : action;
  node.el.title += `\n${formatEstimate(time)} · ${summary} · ${event.reason}`;
  if(event.finding?.sourceUrl)node.el.title+=`\nSource: ${event.finding.sourceUrl}.`;
  for(const credential of event.acquiredCredentials || [])node.el.title+=`\nAcquired credential: ${credential.label} · permissions: ${(credential.permissions || []).join(', ')}`;
  if(event.outcome==='ineligible' && RunDiscovery.observed(event) && !node.el.classList.contains('hit')) {
    node.el.classList.add('probed');
    node.el.querySelector('.node-state').textContent='PROBED · NO ACCESS';
  }
  if (!success && !blocked && !contained && !alertOnly && !conditional && !incomplete) return;

  let result = 'ACCESS ESTABLISHED';
  if (blocked) result = event.mitigation?.badge || 'BLOCKED';
  else if (contained) result = 'ACTION EFFECT SUPPRESSED BY CONTAINMENT';
  else if (conditional) result = 'CONDITIONAL OUTCOME';
  else if (incomplete) result = 'INCOMPLETE EXPLORATION';
  else if (alertOnly) result = 'CANARY ALERT';
  else if (read) result = 'PROTECTED RECORD READ';
  else if (encrypted) result = `ENCRYPTION · ${event.affectedEndpointIds.length} endpoints`;
  else if (exported) result = `DATA EXFILTRATED · ${event.dataTransfer.records==null?'Record count unknown':`${event.dataTransfer.records} records`} · ${event.dataTransfer.destination}`;
  else if (persistent) result = `PERSISTENCE ESTABLISHED · ${event.affectedEndpointIds.length} endpoints`;
  else if (diagnostic) result = 'STAGING CREDENTIAL EXPOSED';
  else if (finding?.illustration === 'git-to-idp') {
    result = 'GIT TOKEN IN EXPOSED LOGS';
    document.getElementById('viewport').classList.add('illustration-active');
  }
  else if (staging) result = 'STAGING STATUS ONLY';
  else if (finding?.category === 'external_misconfiguration') result = 'EDGE ACCESS ONLY';
  else if (finding?.kind === 'anonymous_access') result = 'PUBLIC ACCESS CONFIRMED';
  else if (event.grantedCapability === 'file_read') result = 'FILE READ ONLY';

  if (success || !node.el.classList.contains('hit')) {
    node.el.classList.toggle('hit', success);
    node.el.classList.toggle('defended', blocked);
    node.el.classList.toggle('contained', contained);
    node.el.classList.toggle('alerted', alertOnly);
    node.el.classList.toggle('conditional', conditional);
    node.el.classList.toggle('incomplete', incomplete);
    if (read || encrypted) node.el.classList.add('breach-target');
    node.el.querySelector('.cve').textContent = exported ? 'DATA EXFILTRATED' : finding?.cveId || event.technique || result;
    node.el.querySelector('.vuln-title').textContent = finding?.title || result;
    node.el.querySelector('.node-state').textContent = encrypted ? `${event.affectedEndpointIds.length}/${node.endpointCount || 1} ENCRYPTED` : persistent ? `${event.affectedEndpointIds.length}/${node.endpointCount || 1} PERSISTENT` : phished ? 'PHISH EXECUTED' : exported ? 'DATA EXFILTRATED' : read ? 'DATA FOUND' : blocked ? 'PREVENTED' : contained ? 'CONTAINED' : conditional ? 'CONDITIONAL' : incomplete ? 'INCOMPLETE' : alertOnly ? 'CANARY ALERT' : '';
  }
  if (wire) {
    if (blocked) wire.path.classList.add('defended-wire');
    else if (contained) wire.path.classList.add('contained-wire');
    else if (alertOnly) wire.path.classList.add('alert-wire');
    else wire.path.classList.add('hit-wire');
    if (animate && success) animatePulse(wire);
  }
  socTickets.set(`${node.id}-${event.outcome}-${event.actionKind || 'access'}`, {
    title: summary,
    severity: read || encrypted || exported ? 'CRITICAL' : (phished || persistent || blocked || contained || alertOnly) ? 'HIGH' : 'INFO',
    detail: `${formatEstimate(time)} · ${result}`
  });
}

function renderControl(event) {
  const node = currentNodes.get(event.targetId);
  if (!node || node.el.hidden) return;
  const title = event.control === 'denied' ? 'SOAR lacks response authority'
    : event.control === 'failed' ? 'SOAR enforcement failed'
    : event.control === 'enforced' ? 'SOAR containment effective'
    : event.control === 'decision' ? 'SOAR containment approved'
    : event.source === 'canary' ? 'Canary alerted' : event.source === 'endpoint' ? 'Endpoint behavior telemetry' : event.source==='data-transfer'?'Data transfer telemetry':'Boundary telemetry';
  if (event.control === 'signal' && event.source === 'canary') {
    const marker = node.el.querySelector('.canary-marker') || document.createElement('span');
    marker.className = 'canary-marker';
    marker.textContent = 'Canary alert';
    node.el.append(marker);
  }
  const entry = currentNodes.get(event.scope);
  const detail = `${formatEstimate(event.timeSec)} · Session via ${entry?.label || event.scope}`;
  node.el.title += `\n${title} · ${detail}`;
  socTickets.set(`${event.scope}-${event.control}-${event.source}`, { title, severity: 'HIGH', detail });
}

function buildAttackerTracks(result) {
  const tracks = Array.from({length: result.lanes}, () => []);
  const available = tracks.map(() => 0);
  const jobs = [...new Map(result.events.filter(e => RunDiscovery.observed(e) && Number.isFinite(e.startSec) && Number.isFinite(e.timeSec))
    .map(e => [`${e.sourceId}:${e.targetId}:${e.startSec}:${e.timeSec}`, e])).values()]
    .sort((a,b) => a.startSec-b.startSec || a.timeSec-b.timeSec);
  for (const job of jobs) {
    const worker = available.findIndex(time => time <= job.startSec);
    if (worker < 0) continue; // Multiple findings on an already represented worker action are not extra agents.
    tracks[worker].push(job);
    available[worker] = job.timeSec;
  }
  return tracks;
}

function renderAttackers(time) {
  const layer = document.getElementById('attackers-layer');
  if (!run || !layer) return;
  if (layer.childElementCount !== run.lanes || layer.dataset.actor !== attackerChoice) {
    layer.replaceChildren();layer.dataset.actor = attackerChoice;
    for (let index=0; index<run.lanes; index++) {
      const marker = document.createElement('div');marker.className = 'attacker-marker';
      marker.setAttribute('aria-label', attackerChoice === 'artex' ? `Agent ${index+1}` : 'Attacker');
      marker.style.setProperty('--agent-color', ['#83ecfa','#e9bc7c','#c0a8f1'][index % 3]);
      marker.innerHTML = attackerChoice === 'artex'
        ? '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="6" width="16" height="14" rx="4"/><path d="M12 2v4M1 11h3m16 0h3M8 16h8"/><circle cx="8.5" cy="11" r="1"/><circle cx="15.5" cy="11" r="1"/></svg>'
        : '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7" r="4"/><path d="M4 22v-3a8 8 0 0 1 16 0v3"/></svg>';
      layer.appendChild(marker);
    }
  }
  for (const [index, track] of attackerTracks.entries()) {
    const marker = layer.children[index];
    const job = track.find(e => e.startSec <= time && e.timeSec > time);
    const last = [...track].reverse().find(e => e.timeSec <= time);
    const next = track.find(e => e.startSec >= time);
    const step = job || last || next;
    const target = step && currentNodes.get(step.targetId);
    if (!target || target.el.hidden) { marker.hidden = true; continue; }
    marker.hidden = false;
    const source = currentNodes.get(step.sourceId);
    const fraction = job ? (time-job.startSec)/Math.max(1,job.timeSec-job.startSec) : 1;
    const start = source || {x: 28, y: target.y};
    const x = start.x + (target.x-start.x)*fraction;
    const y = start.y + (target.y-start.y)*fraction;
    marker.style.left = `${x + (index-1)*8}px`;marker.style.top = `${y-36-index*7}px`;
    marker.classList.toggle('working', !!job);
  }
}

const volumeNumber = new Intl.NumberFormat('en-US');

function describeVolume(volume) {
  const parts = [];
  if (Number.isSafeInteger(volume?.records)) parts.push(`${volumeNumber.format(volume.records)} records`);
  if (Number.isSafeInteger(volume?.bytes)) parts.push(`${volumeNumber.format(volume.bytes)} bytes`);
  return parts.length ? parts.join(' / ') : 'volume unknown';
}

function describeDatasetVolume(asset, events) {
  if (asset.isDecoy) return '';
  const read = events.find(event => event.targetId === asset.id && event.isProtectedRead && event.outcome === 'succeeded');
  const transfers = events.filter(event => event.targetId === asset.id && event.actionKind === 'data_exfiltration');
  const exported = transfers.find(event => event.outcome === 'succeeded');
  const inventory = (estate.datasets || []).filter(dataset => dataset.ownerAssetId === asset.id && dataset.sensitivity === 'sensitive' && !dataset.isDecoy);
  if (!inventory.length && !read && !transfers.length) return '';
  const available = inventory.length === 1 ? inventory[0] : asset.dataHandling;
  return [
    `Available · ${describeVolume(available)}`,
    read ? `Read · ${describeVolume(read.dataFound)}` : 'Read · none recorded',
    exported ? `Exported · ${describeVolume(exported.dataTransfer)}`
      : transfers.some(event => ['suppressed', 'interrupted'].includes(event.outcome))
        ? 'Export incomplete · transferred volume unknown'
        : 'Export · no completion recorded'
  ].join(' · ');
}

function renderRunEvidence(time) {
  const events = run.events.filter(event => event.timeSec <= time);
  const successful = events.filter(event => event.outcome === 'succeeded');
  const controls = run.controls.filter(event => event.timeSec <= time);
  const milestones = [
    ['First lateral move', successful.find(event => event.sourceId && event.relationshipId && event.sourceId !== event.targetId && event.grantedCapability !== 'decoy_alert')],
    ['First sensitive read', successful.find(event => event.isProtectedRead)],
    ['First alert', controls.find(event => event.control === 'signal')],
    ['First containment', controls.find(event => event.control === 'enforced')],
    ['First export completed', successful.find(event => event.actionKind === 'data_exfiltration')]
  ].filter(([, event]) => event).sort((a, b) => a[1].timeSec - b[1].timeSec);
  document.getElementById('run-milestones').textContent = milestones.length
    ? milestones.map(([label, event]) => `${label} ${formatEstimate(event.timeSec)}`).join(' · ')
    : 'Modeled milestones appear during playback.';
  const affected = new Set(events.filter(event => event.isProtectedRead || event.actionKind === 'data_exfiltration').map(event => event.targetId));
  const volumes = document.getElementById('run-data-volumes');
  volumes.replaceChildren(...estate.assets.filter(asset => affected.has(asset.id)).flatMap(asset => {
    const text = describeDatasetVolume(asset, events);
    if (!text) return [];
    const item = document.createElement('li');
    item.textContent = `${asset.label} · ${text}`;
    return [item];
  }));
  volumes.hidden = !volumes.children.length;
}

function renderHistoricalTiming() {
  const references = [
    ['crowdstrike-2023-ecrime-breakout-mean', '2023 eCrime breakout mean'],
    ['crowdstrike-2023-ecrime-breakout-fastest', '2023 eCrime fastest observed breakout'],
    ['gtig-2026-artex-typical-deep-access', 'One ARTEX campaign, typical deep access'],
    ['gtig-2026-artex-fast-deep-access', 'One ARTEX campaign, fast deep access case'],
    ['mandiant-2022-dwell-median', '2022 median time from compromise to discovery']
  ];
  const list = document.getElementById('historical-timing');
  for (const [id, label] of references) {
    const fact = CALIBRATION_REGISTER.observedStatistics.find(statistic => statistic.id === id);
    if (!fact) continue;
    const line = document.createElement('p');
    const link = document.createElement('a');
    link.href = fact.sourceUrl;
    link.textContent = label;
    link.title = `${fact.startMilestone} → ${fact.endMilestone} · ${fact.population}`;
    const seconds = fact.unit === 'minutes' ? fact.value * 60 : fact.value;
    const value = fact.unit === 'days' ? `${fact.value} days` : WireEngine.formatDurationSeconds(seconds);
    line.append(link, ` · ${value}`);
    list.append(line);
  }
}
renderHistoricalTiming();

function showTime(time) {
  modeledTime = time;
  if(time>0)discoveryStarted=true;
  updateDiscoveredMap(time);
  renderAttackers(time);
  const elapsed = time === 0 ? '0 min' : formatEstimate(time);
  if (clock.textContent !== elapsed) clock.textContent = elapsed;
  if (!new URLSearchParams(location.search).has('embedded')) {
    AttackFeed.render(document.getElementById('single-activity'), AttackFeed.activity({
      estate, run, modeledTime, discoveryStarted, done:phaseIndex === phases.length, formatEstimate
    }));
  }
}

function renderPhase(phase, animate = false) {
  discoveryStarted=true;
  updateDiscoveredMap(phase.time);
  for (const event of [...phase.events].sort((a,b) => Number(!a.control)-Number(!b.control))) {
    if (event.control) renderControl(event);
    else renderEvent(event, phase.time, animate);
  }
  renderSocTickets();
  renderRunEvidence(phase.time);
}

function resetGraph() {
  layoutGraph(estate);
  socTickets.clear();
  renderSocTickets();
}

function finishRun() {
  cancelAnimationFrame(frame);
  document.getElementById('run-status').classList.remove('running');
  document.getElementById('run-status').textContent = `${customDefenseConfig?.label || defenseLabels[defense]} · Run ${String(runNumber).padStart(2, '0')} · Complete on Infra ${infrastructureNumber}`;
  svg.querySelectorAll('.probe-wire').forEach(path => path.remove());
  for (; phaseIndex < phases.length; phaseIndex++) renderPhase(phases[phaseIndex]);
  showTime(phases.at(-1)?.time ?? 0);
  socLooping = true;
  renderSocTickets();
  const { truncated, layerSuccessCounts, blockedTransitions } = run.summary;
  const successes = run.events.filter(event => event.outcome === 'succeeded');
  const read = successes.find(event => event.isProtectedRead);
  const milestone = read ?? successes.at(-1);
  const asset = milestone && currentNodes.get(milestone.targetId);
  const evidence = milestone?.finding?.cveId || milestone?.technique;
  const sampleLogs = successes.find(event => event.finding?.technique === 'T1552.001');
  const result = read ? `Protected record read at ${asset.label} (${formatEstimate(read.timeSec)})`
    : asset ? `Reached ${asset.label} (${formatEstimate(milestone.timeSec)})`
    : 'No access established';
  const limit = truncated ? `Exploration incomplete · ${run.summary.evaluatedTransitions}/${run.summary.explorationLimit} transitions` : '';
  const count = layerSuccessCounts[0];
  const containments = run.controls.filter(event => event.control === 'enforced');
  const canarySignals = run.controls.filter(event => event.control === 'signal' && event.source === 'canary');
  const late = read && containments.some(event => event.scope === read.scope && event.timeSec >= read.timeSec);
  const response = late ? 'SOAR contained after the read'
    : run.result.containedSessions ? `${run.result.containedSessions} ${run.result.containedSessions === 1 ? 'session' : 'sessions'} contained`
    : defense === 'canaries' ? (canarySignals.length ? 'Canary alerted (alert only)' : 'Canary untouched')
    : run.controls.some(event => event.control === 'failed') ? 'Enforcement failed'
    : run.controls.some(event => event.control === 'denied') ? 'Response authority unavailable'
    : run.controls.some(event => event.control === 'signal') ? 'Alert received; no confirmed enforcement'
    : defense.startsWith('soc') || defense === 'combined' ? 'No matching signal' : '';
  runHud.className = run.result.style;
  const illustration = run.events.some(event => event.outcome === 'succeeded' && event.finding?.illustration === 'git-to-idp')
    ? 'Illustrative branch ends at IdP admin' : '';
  const activeGroup = activePre2023Group();
  const group = run.lanes === 1 ? pre2023Groups[activeGroup] : '';
  const entryFailure = run.lanes === 1 && !successes.length && run.events.find(event => !event.sourceId && event.outcome === 'ineligible' &&
    event.finding?.kind === 'phishing_attachment' && WireEngine.gangTechniqueEvidence(activeGroup,event.finding.technique));
  const lateral = RunDiscovery.lateralStatus(estate,run);
  runHud.textContent = [group, run.result.label, result, evidence, limit, sampleLogs?.finding.title, `${count} external ${count === 1 ? 'entry' : 'entries'} reached`,
    entryFailure?.reason,
    lateral && `${lateral.summary}: ${lateral.detail}`,
    run.summary.encryptedEndpointIds?.length ? `${run.summary.encryptedEndpointIds.length} endpoints encrypted` : '',
    read ? describeDatasetVolume(estate.assets.find(node => node.id === read.targetId), run.events) : '',
    run.summary.persistentEndpointIds?.length ? `Persistence established on ${run.summary.persistentEndpointIds.length} endpoints` : '',
    blockedTransitions ? `${blockedTransitions} blocked` : '', run.summary.suppressedTransitions ? `${run.summary.suppressedTransitions} effects suppressed` : '', response, illustration].filter(Boolean).join(' · ');
}

function activePre2023Group() {
  if (pre2023Pattern && pre2023Pattern.value !== 'rotation' && pre2023Groups[pre2023Pattern.value]) {
    return pre2023Pattern.value;
  }
  return (pre2023Group ??= drawPre2023Group());
}

function updatePre2023PatternTooltip() {
  if (!pre2023Pattern) return;

const ctrlVirtualPatching = document.getElementById('ctrl-virtual-patching');
const ctrlCanaries = document.getElementById('ctrl-canaries');
const ctrlResponsePolicy = document.getElementById('ctrl-response-policy');
const ctrlGenerationMode = document.getElementById('ctrl-generation-mode');
const archetypeSelector = document.getElementById('archetype-selector');
const advancedControlsToggle = document.getElementById('advanced-controls-toggle');
const advancedControlsPanel = document.getElementById('advanced-controls-panel');
let customDefenseConfig = null;

function syncSwitches(cfg) {
  const matchingCard = [...modeButtons].find(button => {
    const preset = normalizeDefenseConfig(button.dataset.mode);
    return preset.virtualPatching === cfg.virtualPatching && preset.canaries === cfg.canaries &&
      preset.responsePolicy === cfg.responsePolicy;
  });
  defense = matchingCard?.dataset.mode || 'baseline';
  customDefenseConfig = matchingCard ? null : cfg;
  for (const button of modeButtons) {
    button.classList.toggle('selected', button === matchingCard);
    button.setAttribute('aria-pressed', String(button === matchingCard));
  }
  if (ctrlVirtualPatching) ctrlVirtualPatching.checked = !!cfg.virtualPatching;
  if (ctrlCanaries) ctrlCanaries.checked = !!cfg.canaries;
  if (ctrlResponsePolicy) ctrlResponsePolicy.value = cfg.responsePolicy;
}
syncSwitches(normalizeDefenseConfig(defense));

function playRun() {
  cancelAnimationFrame(frame);
  const attackerId = attackerChoice === 'pre2023' ? activePre2023Group() : 'artex';
  updatePre2023PatternTooltip();
  run = simulateWireRun(estate, defense, attackerId, customDefenseConfig ? { defenseConfig: customDefenseConfig } : {});
  discoveryPlan = RunDiscovery.create(estate,run);
  discoveryStarted = false;
  attackerTracks = buildAttackerTracks(run);
  runNumber++;
  const status = document.getElementById('run-status');
  status.classList.add('running');
  status.textContent = `${customDefenseConfig?.label || defenseLabels[defense]} · Run ${String(runNumber).padStart(2, '0')} · Same infrastructure ${infrastructureNumber}`;
  clock.title = 'Modeled time since the assumed foothold. Historical references and run milestones are in Controls & Manifest.';
  const grouped = new Map();
  for (const event of [...run.events, ...run.controls]) {
    if (!grouped.has(event.timeSec)) grouped.set(event.timeSec, []);
    grouped.get(event.timeSec).push(event);
  }
  phases = [...grouped].sort(([a], [b]) => a - b)
    .map(([time, events]) => ({ time, events }));
  phaseIndex = 0;
  modeledTime = 0;
  socLooping = false;
  delete document.querySelector('#single-activity ol').dataset.signature;
  document.getElementById('single-activity').scrollTop = 0;
  resetGraph();
  runHud.className = '';
  runHud.textContent = attackerChoice === 'artex' ? 'Exploring reachable services' : `${pre2023Groups[attackerId]} · Exploring reachable services`;
  showTime(0);
  renderRunEvidence(-1);

  let startedAt = null;
  let duration;
  let fromTime;
  function tick(now) {
    const phase = phases[phaseIndex];
    if (!phase) {
      finishRun();
      return;
    }
    if (startedAt === null) {
      startedAt = now;
      fromTime = modeledTime;
      duration = Math.max(showProbes(phase.events, run.lanes), 650);
    }
    const progress = Math.min(1, (now - startedAt) / duration);
    showTime(fromTime + (phase.time - fromTime) * progress);
    if (progress === 1) {
      renderPhase(phase, true);
      phaseIndex++;
      startedAt = null;
    }
    frame = requestAnimationFrame(tick);
  }
  frame = requestAnimationFrame(tick);
}

modeButtons.forEach(button => {
  button.addEventListener('click', () => {
    syncSwitches(normalizeDefenseConfig(button.dataset.mode));
    playRun();
  });
});

  importManifestInput.addEventListener('change', async (e) => {
    const file = e.target.files?.[0];

    const { attackerId, defenseConfig } = res.manifest;
    estate = res.manifest.estate;
    referenceCase = null;
    attackerChoice = attackerId === 'artex' ? 'artex' : 'pre2023';
    if (attackerChoice === 'pre2023') pre2023Pattern.value = attackerId;
    for (const button of attackerButtons) {
      const selected = button.dataset.attacker === attackerChoice;
      button.classList.toggle('selected', selected);
      button.setAttribute('aria-pressed', String(selected));
    }
    syncSwitches(defenseConfig);
    archetypeSelector.value = estate.archetypeId || 'auto';
    ctrlGenerationMode.value = estate.generationMode || 'authored_walkthrough';
    playRun();
  });
}
attackerButtons.forEach(button => button.addEventListener('click', () => {
  attackerChoice = button.dataset.attacker;
  attackerButtons.forEach(candidate => {
    const selected = candidate === button;
    candidate.classList.toggle('selected', selected);
    candidate.setAttribute('aria-pressed', String(selected));
  });
  playRun();
}));
pre2023Pattern.addEventListener('change', () => {
  if (pre2023Pattern.value !== 'rotation' && attackerChoice !== 'pre2023') {
    attackerChoice = 'pre2023';
    attackerButtons.forEach(candidate => {
      const selected = candidate.dataset.attacker === 'pre2023';
      candidate.classList.toggle('selected', selected);
      candidate.setAttribute('aria-pressed', String(selected));
    });
  }
  playRun();
});
function applyAssetSearch() {
  const query = document.getElementById('asset-search').value.trim().toLowerCase();
  const matches = new Set();
  for (const node of currentNodes.values()) {
    const match = !node.el.hidden && !!query && `${node.label} ${node.product} ${node.el.title}`.toLowerCase().includes(query);
    node.el.classList.toggle('search-match', match);
    node.el.classList.toggle('search-dim', !!query && !match);
    if (match) matches.add(node.id);
  }
  for (const wire of currentWires.values()) wire.path.classList.toggle('search-wire', matches.has(wire.source.id) || matches.has(wire.target.id));
  document.getElementById('search-count').textContent = query ? `${matches.size} matching assets` : '';
}
document.getElementById('search-toggle').addEventListener('click', () => {
  const input = document.getElementById('asset-search');
  input.hidden = !input.hidden;
  document.getElementById('search-toggle').setAttribute('aria-expanded', String(!input.hidden));
  if (!input.hidden) input.focus();
  else { input.value = ''; applyAssetSearch(); }
});
document.getElementById('asset-search').addEventListener('input', applyAssetSearch);
document.getElementById('asset-search').addEventListener('keydown', event => {
  if (event.key === 'Escape') document.getElementById('search-toggle').click();
});
function applianceRoster(estate) {
  return estate.assets.filter(asset => asset.referenceCve).map(asset => asset.groupId).sort().join();
}

function drawReferenceCase() {
  if (!catalog) return null;
  if (!catalogDeck.length) catalogDeck = [...catalog.examples];
  const index = Math.floor(Math.random() * catalogDeck.length);
  const [example] = catalogDeck.splice(index, 1);
  return { example, context: catalog.infrastructure[example.context] };
}

function drawPre2023Group() {
  if (!pre2023Deck.length) pre2023Deck = Object.keys(pre2023Groups);
  const index = Math.floor(Math.random() * pre2023Deck.length);
  return pre2023Deck.splice(index, 1)[0];
}

function newInfra() {
  infrastructureNumber++;
  const previous = applianceRoster(estate);
  referenceCase = archetypeSelector.value === 'full-enterprise' ? null : drawReferenceCase();
  pre2023Group = drawPre2023Group();
  const chosenArchetype = (archetypeSelector && archetypeSelector.value !== 'auto')
    ? archetypeSelector.value
    : referenceCase?.context.archetypeId;
  const chosenMode = ctrlGenerationMode?.value || 'authored_walkthrough';
  do {
    estate = generateEstate({
      generationMode: chosenMode,
      archetypeId: chosenArchetype,
      preferredIngress: referenceCase?.context.groups[0]
    });
  } while (applianceRoster(estate) === previous);
  playRun();
}
activityToggle.addEventListener('click', () => {
  const stage = document.querySelector('.single-stage');
  const hidden = stage.classList.toggle('feed-hidden');
  activityToggle.setAttribute('aria-expanded', String(!hidden));
  activityToggle.textContent = hidden ? 'Reveal CVE stream' : 'Hide CVE stream';
});
document.getElementById('new-run-btn').addEventListener('click', newInfra);
document.getElementById('map-replay-btn').addEventListener('click', playRun);
document.getElementById('map-results-btn').addEventListener('click', finishRun);
window.addEventListener('resize', () => {
  resetGraph();
  phases.slice(0, phaseIndex).forEach(phase => renderPhase(phase));
  showTime(modeledTime);
});
async function startWire() {
  try {
    const response = await fetch('assets/wire-defense-catalog.json');
    if (!response.ok) throw new Error(`Catalog request returned ${response.status}`);
    catalog = await response.json();
  } catch {
    playRun();
    return;
  }
  newInfra();
}
document.getElementById('dual-view-link').addEventListener('click', () => {
  sessionStorage.setItem('wire-comparison-estate', JSON.stringify(estate));
});
document.fonts.ready.then(() => {
  if (new URLSearchParams(location.search).has('embedded') || new URLSearchParams(location.search).get('capture') === 'path') return;
  const saved = sessionStorage.getItem('wire-return-estate');
  if (saved) {
    sessionStorage.removeItem('wire-return-estate');
    estate = JSON.parse(saved); referenceCase = null; infrastructureNumber = 1;
    if (estate.archetypeId === 'full-enterprise') archetypeSelector.value = 'full-enterprise';
    playRun();
  } else startWire();
});
</script>
<script src="js/dual-bridge.js"></script>
<script src="js/capture-plan.js"></script>
<script src="js/path-capture.js"></script>
</body>
