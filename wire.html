<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ARTEX | Wire Diagram Simulation v2.4.0</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
<style>
  :root {
    --bg: #071426;
    --turquoise: #00f0ff;
    --turquoise-glow: rgba(0, 240, 255, 0.45);
    --green: #00ff77;
    --green-glow: rgba(0, 255, 119, 0.65);
    --green-wire: rgba(0, 255, 119, 0.48);
    --red: #ff2244;
    --red-glow: rgba(255, 34, 68, 0.85);
    --red-wire: #ff2244;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
  }

  html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background-color: var(--bg);
    color: #fff;
    font-family: 'JetBrains Mono', 'Fira Code', 'Segoe UI', Consolas, monospace;
  }

  /* Full screen canvas and graph viewport */
  #viewport {
    position: relative;
    width: 100vw;
    height: 100vh;
    background: radial-gradient(circle at 50% 45%, #10253b 0%, #071426 75%, #050f1e 100%);
    overflow: hidden;
  }

  /* Faint background grid for circuit cyber aesthetic */
  .circuit-grid {
    position: absolute;
    inset: 0;
    background-image: 
      linear-gradient(rgba(0, 255, 119, 0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 255, 119, 0.02) 1px, transparent 1px);
    background-size: 50px 50px;
    pointer-events: none;
  }

  /* TOP HEADER - Mode selection strip + NEW RUN + Live HUD */
  .top-bar {
    position: absolute;
    top: 14px;
    left: 0;
    right: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    padding: 0 150px;
    z-index: 1000;
    pointer-events: none;
  }

  /* 4 Run Type Scenario Buttons along the top */
  .mode-strip {
    display: flex;
    align-items: center;
    gap: 5px;
    flex-wrap: wrap;
    justify-content: center;
    pointer-events: auto;
  }

  .mode-btn {
    background: rgba(9, 16, 24, 0.88);
    border: 1px solid rgba(88, 217, 219, 0.22);
    color: #8fa3b8;
    padding: 4px 8px;
    border-radius: 4px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 2px;
    backdrop-filter: blur(8px);
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    outline: none;
    text-align: left;
  }

  .mode-btn:hover {
    border-color: var(--turquoise);
    color: #e6edf5;
    background: rgba(14, 28, 38, 0.95);
    transform: translateY(-1px);
  }

  .mode-btn.selected {
    background: rgba(0, 36, 44, 0.95);
    border-color: var(--turquoise);
    color: var(--turquoise);
    box-shadow: 0 0 14px rgba(0, 240, 255, 0.35), inset 0 0 8px rgba(0, 240, 255, 0.15);
  }

  .mode-btn .mode-title {
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #abbecd;
  }

  .mode-btn.selected .mode-title {
    color: var(--turquoise);
  }

  .mode-btn .mode-desc {
    font-size: 7.5px;
    letter-spacing: 0.05em;
    color: #64788c;
    white-space: nowrap;
  }

  .mode-btn.selected .mode-desc {
    color: #8bebf0;
  }

  .run-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    pointer-events: auto;
  }

  #new-run-btn {
    pointer-events: auto;
    background: rgba(0, 30, 36, 0.85);
    border: 1.5px solid var(--turquoise);
    color: var(--turquoise);
    padding: 5px 14px;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    border-radius: 4px;
    cursor: pointer;
    box-shadow: 0 0 16px var(--turquoise-glow), inset 0 0 10px rgba(0, 240, 255, 0.2);
    backdrop-filter: blur(10px);
    transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    outline: none;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  #new-run-btn:hover {
    background: var(--turquoise);
    color: #001015;
    box-shadow: 0 0 30px rgba(0, 240, 255, 0.85), inset 0 0 15px rgba(255, 255, 255, 0.7);
    transform: scale(1.04);
  }

  #new-run-btn:active {
    transform: scale(0.98);
  }

  #new-run-btn .run-icon {
    font-size: 12px;
    display: inline-block;
    transition: transform 0.4s ease;
  }

  #new-run-btn:hover .run-icon {
    transform: rotate(180deg);
  }

  /* Live Outcome HUD under NEW RUN button */
  #run-hud {
    font-size: 9.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--turquoise);
    background: rgba(0, 16, 22, 0.8);
    border: 1px solid rgba(0, 240, 255, 0.25);
    padding: 4px 9px;
    border-radius: 3px;
    backdrop-filter: blur(6px);
    text-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
    transition: all 0.3s ease;
  }
  #run-hud.breached {
    color: #ff9ba8;
    border-color: rgba(255, 34, 68, 0.4);
    text-shadow: 0 0 4px rgba(255, 34, 68, 0.3);
    background: rgba(26, 4, 8, 0.85);
  }
  #run-hud.contained {
    color: #65d7a5;
    border-color: rgba(101, 215, 165, 0.4);
    text-shadow: 0 0 8px rgba(101, 215, 165, 0.6);
    background: rgba(4, 20, 14, 0.85);
  }

  /* Discreet nav link to return to table view */
  .back-link {
    position: absolute;
    top: 20px;
    right: 26px;
    pointer-events: auto;
    color: rgba(255, 255, 255, 0.35);
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-decoration: none;
    border: 1px solid rgba(255, 255, 255, 0.12);
    padding: 5px 11px;
    border-radius: 3px;
    transition: all 0.2s;
    z-index: 1000;
  }
  .back-link:hover {
    color: var(--turquoise);
    border-color: var(--turquoise);
    background: rgba(0, 240, 255, 0.08);
  }

  /* SVG layer for wires and pulses */
  #wire-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 10;
  }

  .wire {
    fill: none;
    stroke: var(--green-wire);
    stroke-width: 1.25;
    stroke-linecap: round;
    transition: stroke 0.4s ease, stroke-width 0.3s ease, filter 0.3s ease, stroke-opacity 0.4s ease;
  }

  .attack-entry {
    fill: none;
    stroke: #ff304f;
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-dasharray: 3 7;
    animation: probeFade 0.75s ease-out forwards;
    filter: drop-shadow(0 0 5px rgba(255, 34, 68, 0.75));
  }

  @keyframes probeFade { 0%, 45% { opacity: 1; } 100% { opacity: 0; } }

  .attack-entry-head {
    fill: #ff304f;
    filter: drop-shadow(0 0 5px rgba(255, 34, 68, 0.75));
  }

  .wire.active-wire {
    stroke: #ff304f;
    stroke-opacity: 0.95;
    stroke-width: 2;
    stroke-dasharray: 3 7;
    filter: drop-shadow(0 0 4px rgba(255, 34, 68, 0.75));
  }

  .wire.hit-wire {
    stroke: var(--red);
    stroke-opacity: 0.95;
    stroke-width: 2.2;
    filter: drop-shadow(0 0 6px var(--red-glow));
    stroke-dasharray: none;
  }

  /* Traveling energy packet along wires */
  .wire-packet {
    fill: var(--red);
    filter: drop-shadow(0 0 6px var(--red));
  }

  /* DOM Nodes Layer */
  #nodes-layer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 20;
    pointer-events: none;
  }

  /* Smaller, sleek node items */
  .node {
    position: absolute;
    /* Anchor the 36px icon, not the combined icon-and-label box, at x/y. */
    transform: translate(-50%, -18px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: auto;
    cursor: pointer;
    transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .node:hover {
    transform: translate(-50%, -18px) scale(1.15);
    transform-origin: center 18px;
    z-index: 100;
  }

  /* Node Icon Box - Smaller */
  .node-icon-wrapper {
    position: relative;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Ambient glowing ring around icon */
  .node-halo {
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    border: 1px dashed var(--green);
    opacity: 0.35;
    transition: all 0.4s ease;
    animation: rotateSlow 25s linear infinite;
  }

  @keyframes rotateSlow {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  /* The Icon itself using pure CSS Mask: smaller, crisp, transparent */
  .node-icon {
    width: 26px;
    height: 26px;
    background-color: var(--green);
    -webkit-mask-size: contain;
    -webkit-mask-repeat: no-repeat;
    -webkit-mask-position: center;
    mask-size: contain;
    mask-repeat: no-repeat;
    mask-position: center;
    filter: drop-shadow(0 0 5px var(--green-glow));
    transition: background-color 0.4s ease, filter 0.4s ease, transform 0.3s ease;
  }

  /* Node Label - Very Light Green for maximum legibility */
  .node-label {
    margin-top: 4px;
    font-size: 8.5px;
    font-weight: 600;
    letter-spacing: 0.05em;
    color: #d4ffe8;
    text-shadow: none;
    background: #071426;
    border-radius: 2px;
    padding: 1px 3px;
    white-space: normal;
    overflow-wrap: anywhere;
    text-align: center;
    width: max-content;
    max-width: 150px;
    transition: color 0.4s ease, text-shadow 0.4s ease;
  }

  /* KEV Title underneath in RED (hidden initially, displays on hit) */
  .node-kev {
    margin-top: 3px;
    font-family: 'Segoe UI', Arial, sans-serif;
    font-size: 9px;
    font-weight: 700;
    color: #ff9ba8;
    text-shadow: 0 0 3px rgba(255, 34, 68, 0.25);
    white-space: normal;
    overflow-wrap: anywhere;
    text-align: center;
    width: max-content;
    max-width: 160px;
    background: #2d060c;
    border: 1px solid rgba(255, 34, 68, 0.55);
    border-radius: 3px;
    padding: 2px 5px;
    opacity: 0;
    transform: translateY(-3px) scale(0.9);
    transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    pointer-events: none;
    box-shadow: 0 0 10px rgba(255, 34, 68, 0.3);
  }

  .node-kev .cve {
    font-weight: 800;
    letter-spacing: 0.01em;
  }

  .node-kev .vuln-title {
    display: block;
    font-size: 8px;
    opacity: 1;
    font-weight: 600;
  }

  /* HIT STATE: Lit in RED */
  .node.hit .node-icon {
    background-color: var(--red);
    filter: drop-shadow(0 0 12px var(--red-glow)) drop-shadow(0 0 20px var(--red));
    transform: scale(1.1);
  }

  .node.hit .node-halo {
    border-color: var(--red);
    border-style: solid;
    opacity: 0.85;
    box-shadow: 0 0 12px var(--red-glow);
    animation: hitPulse 1.2s ease-out infinite alternate;
  }

  .node.hit .node-label {
    color: #ffadb8;
    text-shadow: 0 0 4px rgba(255, 34, 68, 0.3);
  }

  .node.hit, .node.defended {
    z-index: 10;
  }

  .node.hit .node-kev {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  /* DEFENDED / BLOCKED STATE */
  .node.defended .node-icon {
    background-color: #f3bd64;
    filter: drop-shadow(0 0 10px rgba(243, 189, 100, 0.8));
    transform: scale(1.05);
  }
  .node.defended .node-halo {
    border-color: #f3bd64;
    border-style: double;
    opacity: 0.85;
    box-shadow: 0 0 10px rgba(243, 189, 100, 0.5);
  }
  .node.defended .node-label {
    color: #f3bd64;
    text-shadow: 0 0 6px rgba(243, 189, 100, 0.6);
  }
  .node.defended .node-kev {
    opacity: 1;
    transform: translateY(0) scale(1);
    color: #f3bd64;
    border-color: rgba(243, 189, 100, 0.6);
    background: #1e1606;
    text-shadow: 0 0 8px rgba(243, 189, 100, 0.5);
    box-shadow: 0 0 10px rgba(243, 189, 100, 0.3);
  }

  /* DATABASE CLUSTER BREACH TARGET */
  .node.breach-target .node-icon {
    background-color: #ff003c;
    filter: drop-shadow(0 0 16px #ff003c) drop-shadow(0 0 28px #ff003c);
    animation: breachShake 0.4s ease infinite alternate;
  }
  .node.breach-target .node-kev {
    border-color: #ff003c;
    background: #32000c;
    box-shadow: 0 0 16px rgba(255, 0, 60, 0.7);
  }

  @keyframes breachShake {
    0% { transform: scale(1.12) rotate(-2deg); }
    100% { transform: scale(1.15) rotate(2deg); }
  }

  .wire.defended-wire {
    stroke: #765d34 !important;
    stroke-opacity: 0.7 !important;
    stroke-dasharray: 4 4 !important;
  }

  @keyframes hitPulse {
    0% { transform: scale(1); opacity: 0.8; }
    100% { transform: scale(1.22); opacity: 0.3; }
  }

  /* Flash impact burst when hit */
  .impact-burst {
    position: absolute;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 2px solid var(--red);
    pointer-events: none;
    animation: burstExpand 0.65s cubic-bezier(0.1, 0.8, 0.2, 1) forwards;
  }

  @keyframes burstExpand {
    0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(5.5); opacity: 0; }
  }
</style>

/**
 * Checks whether a given vulnerability can be addressed by the active mitigation scenario.
 */
function soarDetects(node) {
  // A repeatable simulation assumption, not a measured product detection rate.
  let hash = (2166136261 ^ soarSeed) >>> 0;
  for (const char of node.id) hash = Math.imul(hash ^ char.charCodeAt(0), 16777619);
  hash ^= hash >>> 16; hash = Math.imul(hash, 0x7feb352d);
  hash ^= hash >>> 15; hash = Math.imul(hash, 0x846ca68b);
  hash ^= hash >>> 16;
  return (hash >>> 0) / 4294967296 < SOAR_DETECTION_RATE;
}

function wafPortalCovered(node) {
  let hash = (0x9e3779b9 ^ soarSeed) >>> 0;
  for (const char of node.id) hash = Math.imul(hash ^ char.charCodeAt(0), 16777619);
  hash ^= hash >>> 16; hash = Math.imul(hash, 0x7feb352d);
  hash ^= hash >>> 15; hash = Math.imul(hash, 0x846ca68b);
  hash ^= hash >>> 16;
  return (hash >>> 0) / 4294967296 < WAF_PORTAL_COVERAGE;
}

function edgeSoarDetects(node) {
  let hash = (0x85ebca6b ^ soarSeed) >>> 0;
  for (const char of node.id) hash = Math.imul(hash ^ char.charCodeAt(0), 16777619);
  hash ^= hash >>> 16; hash = Math.imul(hash, 0x7feb352d);
  hash ^= hash >>> 15; hash = Math.imul(hash, 0x846ca68b);
  hash ^= hash >>> 16;
  return (hash >>> 0) / 4294967296 < EDGE_SOAR_DETECTION_RATE;
}

function checkVulnMitigation(vulnId, mode, node) {
  if (node.vulnerabilityAssigned === false) {
    return { addressed: true, noAssignedVulnerability: true, badge: 'NO FINDING', reason: 'No exploitable exposure was assigned to this asset in this infrastructure.' };
  }
  if (node.targetDef?.publicExposure) {
    if ((mode === 'defender' || mode === 'combined') && soarDetects(node)) {
      return { addressed: true, badge: 'CONTAINED · AGENTIC SOAR', control: 'NIST AC-3 / SI-4', reason: 'Simulation assumption: SOAR detects and closes the public exposure.' };
    }
    return { addressed: false, badge: 'PUBLIC EXPOSURE', reason: node.targetDef.publicExposure };
  }
  if (node.targetDef?.vulnerabilityChance != null && !vulnId) {
    return { addressed: true, noAssignedVulnerability: true, badge: 'NO ASSIGNED CVE', reason: 'This control has no modeled vulnerability in this infrastructure; the attack cannot exploit it.' };
  }
  if (!vulnId) {
    if (node.layerIdx > 0 && (mode === 'defender' || mode === 'combined') && soarDetects(node)) {
      return { addressed: true, badge: 'CONTAINED · AGENTIC SOAR', control: 'NIST SI-4 / AC-3', reason: 'Simulation assumption: SOAR detects anomalous use of compromised credentials and revokes access.' };
    }
    return { addressed: false, badge: 'T1078 · VALID ACCOUNTS', reason: 'Simulated technique: the attacker uses assumed compromised account credentials to access this asset. No CVE is mapped.' };
  }
  if (mode === 'baseline') {
    return {
      addressed: false,
      badge: 'EXPLOITED',
      reason: 'Baseline scenario unmitigated: zero active defenses applied'
    };
  }

  const rule = KEV_MITIGATION_RULES[vulnId] || {
    waf: { mitigates: node.layerIdx <= 1, control: 'NIST SI-2', reason: 'Perimeter filtering rule' },
    ml:  { mitigates: node.layerIdx >= 1, control: 'NIST SI-4', reason: 'Internal anomaly detection' }
  };
  const isNonHttpProtocol = ['aws-vpn', 'az-net', 'az-branch', 'partner-gw'].includes(node.groupId);
  // These web portals may or may not be behind an inline WAF in each generated
  // infrastructure. This models coverage, not a measured protection rate.
  const portalIds = ['forti-vpn', 'pulse-vpn', 'pan-globalprotect'];
  const portalCovered = !portalIds.includes(node.groupId) || wafPortalCovered(node);
  const wafMitigates = !isNonHttpProtocol && portalCovered && rule.waf?.mitigates;
  // SOAR can also receive telemetry from monitored perimeter web portals.
  // The modeled sensor shares the same inline placement as the WAF.
  const edgeSoarMitigates = node.layerIdx === 0 && (!portalIds.includes(node.groupId) || portalCovered) && edgeSoarDetects(node);
  const soarMitigates = edgeSoarMitigates || (rule.ml?.mitigates && soarDetects(node));

  if (mode === 'patch') {
    // WAF only inspects HTTP/HTTPS traffic: completely blind to VPNs, SD-WAN, and private peered links
    if (isNonHttpProtocol) {
      return {
        addressed: false,
        badge: 'WAF BLIND',
        reason: 'WAF operates at L7 HTTP; completely blind to VPN tunnels and network backbone protocols'
      };
    }

    if (wafMitigates) {
      return {
        addressed: true,
        badge: 'SHIELDED · WAF VIRTUAL PATCH',
        control: rule.waf.control,
        reason: rule.waf.reason
      };
    }
    return {
      addressed: false,
      badge: 'WAF BYPASS',
      reason: !portalCovered ? 'Simulated public portal is not behind the inline WAF.' : (rule.waf ? rule.waf.reason : 'Vulnerability unaddressed by perimeter WAF')
    };
  }

  if (mode === 'defender') {
    if (soarMitigates) {
      return {
        addressed: true,
        badge: 'CONTAINED · AGENTIC SOAR',
        control: rule.ml.control,
        reason: edgeSoarMitigates ? 'Simulation assumption: SOAR detects anomalous activity using monitored portal telemetry.' : rule.ml.reason
      };
    }
    return {
      addressed: false,
      badge: 'ML MISSED',
      reason: rule.ml?.mitigates ? 'Simulated SOAR detection missed this attack.' : (rule.ml?.reason || 'Activity does not trigger the simulated detection rule')
    };
  }

  if (mode === 'combined') {
    // Defense-in-depth: WAF + ML + Honeytokens
    if (wafMitigates) {
      return {
        addressed: true,
        badge: 'SHIELDED · WAF VIRTUAL PATCH',
        control: rule.waf.control,
        reason: rule.waf.reason
      };
    }
    if (soarMitigates) {
      return {
        addressed: true,
        badge: 'CONTAINED · AGENTIC SOAR',
        control: rule.ml.control,
        reason: edgeSoarMitigates ? 'Simulation assumption: SOAR detects anomalous activity using monitored portal telemetry.' : rule.ml.reason
      };
    }
    return {
      addressed: false,
      badge: 'UNADDRESSED',
      reason: 'The attack bypassed the simulated WAF rule and SOAR detection.'
    };
  }

  return { addressed: false, badge: 'EXPLOITED', reason: 'Unmitigated' };
}

const rand = (min, max) => Math.random() * (max - min) + min;
const randInt = (min, max) => Math.floor(rand(min, max + 1));
const shuffle = arr => [...arr].sort(() => Math.random() - 0.5);

function safeTimeout(fn, delay) {
  const t = setTimeout(() => {
    fn();
  }, delay);
  activeTimeouts.push(t);
  return t;
}

function clearAllActiveTimeouts() {
  activeTimeouts.forEach(t => clearTimeout(t));
  activeTimeouts = [];
}

/**
 * Organically position all objects across the screen and cluster them neatly.
 * Nodes are smaller, more numerous, and neatly grouped.
 */
function layoutGraph(snapshot = null) {
  const w = window.innerWidth;
  const h = window.innerHeight;
  // Reserve space for the controls and node labels at the top and bottom.
  const graphTop = Math.min(h * 0.4, document.querySelector('.top-bar').getBoundingClientRect().bottom + 65);
  const graphBottom = Math.max(graphTop + 1, h - 65);
  const graphHeight = graphBottom - graphTop;
  currentNodes = [];
  currentWires = [];
  nodesLayer.innerHTML = '';
  svg.innerHTML = '';

  if (snapshot) {
    currentNodes = snapshot.nodes.map(node => ({ ...node, x: node.x * w, y: graphTop + node.y * graphHeight, downstream: [], el: null, hit: false, defended: false }));
    const nodesById = new Map(currentNodes.map(node => [node.id, node]));
    snapshot.wires.forEach(([sourceId, targetId]) => {
      const source = nodesById.get(sourceId), target = nodesById.get(targetId);
      if (!source || !target) throw new Error('Saved infrastructure has an invalid connection');
      source.downstream.push(target.id);
      createWire(source, target);
    });
  } else {
  LAYER_CONFIG.forEach((layer, layerIdx) => {
    const numClusters = layer.clusters.length;
    const clusterHeight = graphHeight / numClusters;
    const startY = graphTop;

    layer.clusters.forEach((cluster, clusterIdx) => {
      const clusterCenterY = startY + clusterIdx * clusterHeight + clusterHeight * 0.5 + rand(-h * 0.025, h * 0.025);
      const clusterCenterX = w * (layer.xBand[0] + (layer.xBand[1] - layer.xBand[0]) * 0.5) + rand(-w * 0.02, w * 0.02);

      const numTargets = cluster.targets.length;
      cluster.targets.forEach((targetDef, targetIdx) => {
        // Target family center anchor
        const familyAngle = (targetIdx / numTargets) * Math.PI * 2 - Math.PI / 2 + rand(-0.08, 0.08);
        const familyRadiusX = rand(58, 76);
        const familyRadiusY = rand(44, 58);
        const anchorX = Math.max(w * 0.05, Math.min(w * 0.94, clusterCenterX + Math.cos(familyAngle) * familyRadiusX));
        const anchorY = Math.max(graphTop, Math.min(graphBottom, clusterCenterY + Math.sin(familyAngle) * familyRadiusY));

        // Randomly denser forest: 1 to 3 instances of the SAME icon clustered together
        const maxVariants = targetDef.variants.length;
        const instanceCount = maxVariants > 1 ? randInt(1, Math.min(3, maxVariants)) : 1;

        const variants = targetDef.productPool
          ? shuffle(Array.from({ length: maxVariants }, (_, index) => index)).slice(0, instanceCount)
          : Array.from({ length: instanceCount }, (_, index) => index);
        for (let slot = 0; slot < instanceCount; slot++) {
          const vIdx = variants[slot];
          let ox = 0, oy = 0;
          if (instanceCount === 2) {
            ox = (slot === 0 ? -22 : 22) + rand(-3, 3);
            oy = (slot === 0 ? -16 : 16) + rand(-3, 3);
          } else if (instanceCount === 3) {
            const iAngle = (slot / 3) * Math.PI * 2 - Math.PI / 2;
            ox = Math.cos(iAngle) * 24 + rand(-3, 3);
            oy = Math.sin(iAngle) * 20 + rand(-3, 3);
          }

          const nx = Math.max(w * 0.04, Math.min(w * 0.95, anchorX + ox));
          const ny = Math.max(graphTop, Math.min(graphBottom, anchorY + oy));

          // Only explicit per-variant product mappings are eligible. Versions and
          // vulnerable configurations are assumed for this synthetic scenario.
          const vulnerabilityAssigned = Math.random() < (targetDef.vulnerabilityChance ?? ASSET_EXPOSURE_CHANCE[layerIdx]);
          const kevId = vulnerabilityAssigned ? (targetDef.kevByVariant || [])[vIdx] : null;
          const kev = kevId ? LAYER_KEVS[layerIdx].find(k => k.id === kevId) : null;
          if (kevId && !kev) throw new Error(`Unknown CVE ${kevId} for ${targetDef.id}`);

          const node = {
            id: `${targetDef.id}-${vIdx + 1}`,
            groupId: targetDef.id,
            targetDef: targetDef,
            vulnerabilityAssigned,
            label: targetDef.variants[vIdx],
            icon: targetDef.icon,
            isSecurity: !!targetDef.isSecurity,
            isLake: !!targetDef.isLake,
            isDb: !!targetDef.isDb,
            layerIdx: layerIdx,
            clusterName: cluster.name,
            x: nx,
            y: ny,
            kev: kev,
            hit: false,
            defended: false,
            downstream: [],
            el: null
          };

          currentNodes.push(node);
        }
      });
    });
  });

  // Connect each source only to explicitly modeled service families.
  currentNodes.forEach(source => {
    (ALLOWED_CONNECTIONS[source.groupId] || []).forEach(targetGroup => {
      const candidates = currentNodes.filter(n => n.groupId === targetGroup && n.layerIdx === source.layerIdx + 1);
      if (!candidates.length) return;
      const target = candidates.reduce((a, b) => Math.abs(a.y - source.y) < Math.abs(b.y - source.y) ? a : b);
      source.downstream.push(target.id);
      createWire(source, target);
    });
  });

  // Connect remaining instances only when an approved predecessor exists.
  currentNodes.forEach(target => {
    if (currentWires.some(w => w.target.id === target.id)) return;
    const candidates = currentNodes.filter(n => n.layerIdx === target.layerIdx - 1 &&
      (ALLOWED_CONNECTIONS[n.groupId] || []).includes(target.groupId));
    if (!candidates.length) return;
    const source = candidates.reduce((a, b) => Math.abs(a.y - target.y) < Math.abs(b.y - target.y) ? a : b);
    source.downstream.push(target.id);
    createWire(source, target);
  });
  }

  // Retain only externally reachable assets. Publicly exposed repositories and
  // buckets can be terminal entry points; never invent a credential link.
  const reachable = new Set(currentNodes.filter(node => EXTERNAL_ENTRY_GROUPS.has(node.groupId)).map(node => node.id));
  for (let layer = 0; layer < LAYER_CONFIG.length; layer++) {
    currentWires.forEach(wire => { if (reachable.has(wire.source.id)) reachable.add(wire.target.id); });
  }
  currentWires = currentWires.filter(wire => {
    if (reachable.has(wire.source.id) && reachable.has(wire.target.id)) return true;
    wire.path.remove();
    return false;
  });
  currentNodes = currentNodes.filter(node => reachable.has(node.id));
  currentNodes.forEach(node => { node.downstream = node.downstream.filter(id => reachable.has(id)); });

  // These pools represent overlapping controls, rather than distinct service
  // instances such as API gateways, applications, and data platforms. Labels
  // describe the demo inventory; they do not change the simulation topology.
  const overlappingControls = new Set(['waf-proxy', 'iam-idp', 'threat-det']);
  const controlCounts = new Map();
  currentNodes.forEach(node => {
    node.label = node.label.replace(/ · (?:Decommissioned|P\.o\.C)$/, '');
    if (overlappingControls.has(node.groupId)) {
      const position = (controlCounts.get(node.groupId) || 0) + 1;
      controlCounts.set(node.groupId, position);
      if (position === 2) node.label += ' · Decommissioned';
      if (position === 3) node.label += ' · P.o.C';
    }
  });
  if (currentNodes.some(node => node.groupId === 'confluence-node')) {
    const olderConfluence = currentNodes.find(node => node.groupId === 'confluence-admin');
    if (olderConfluence) olderConfluence.label += ' · Decommissioned';
  }

  // Render DOM Nodes with smaller icons
  currentNodes.forEach(node => {
    const el = document.createElement('div');
    el.className = 'node';
    el.id = 'node-' + node.id;
    el.title = node.vulnerabilityAssigned === false ? 'No exploitable exposure assigned in this simulated infrastructure.' : (node.targetDef.publicExposure && `${node.targetDef.attackTechnique} · ${node.targetDef.attackDescription}\n${node.targetDef.publicExposure}`) || (node.kev
      ? 'Simulated CVE mapping: an affected version and configuration are assumed.'
      : node.targetDef.vulnerabilityChance != null
        ? 'No vulnerability assigned to this control in this infrastructure.'
        : 'Simulated MITRE ATT&CK T1078: the attacker uses assumed compromised account credentials. No CVE is assigned.');
    el.style.left = `${node.x}px`;
    el.style.top = `${node.y}px`;

    el.innerHTML = `
      <div class="node-icon-wrapper">
        <div class="node-halo"></div>
        <div class="node-icon" style="-webkit-mask-image: url('${ICON_BASE}${node.icon}'); mask-image: url('${ICON_BASE}${node.icon}');"></div>
      </div>
      <div class="node-label">${node.label}</div>
      <div class="node-kev">
        <span class="cve">${node.kev ? node.kev.id : node.targetDef.publicExposure ? node.targetDef.attackTechnique : 'T1078 · VALID ACCOUNTS'}</span>
        <span class="vuln-title">${node.kev ? node.kev.title : node.targetDef.publicExposure ? `${node.targetDef.attackDescription} · public access misconfiguration` : 'Assumed compromised credentials'}</span>
      </div>
    `;

    el.addEventListener('click', (e) => {
      e.stopPropagation();
      triggerNodeHit(node);
    });

    nodesLayer.appendChild(el);
    node.el = el;
  });

  window.currentNodes = currentNodes;
  window.currentWires = currentWires;
}

function createWire(source, target) {
  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  path.setAttribute('class', 'wire');
  svg.appendChild(path);
  const wire = {
    source,
    target,
    path,
    hit: false,
    defended: false
  };
  path.setAttribute('d', `M ${source.x} ${source.y} L ${target.x} ${target.y}`);
  currentWires.push(wire);
}

function drawAttackEntries(nodes) {
  nodes.forEach(node => {
    const endX = Math.max(8, node.x - 24);
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    line.setAttribute('class', 'attack-entry');
    line.setAttribute('d', `M -20 ${node.y} L ${endX} ${node.y}`);
    svg.appendChild(line);

    const head = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    head.setAttribute('class', 'attack-entry-head');
    head.setAttribute('d', `M ${endX} ${node.y} l -11 -7 v 14 z`);
    svg.appendChild(head);
  });
}

/**
 * Resets the visual state of the existing infrastructure without rebuilding it.
 */
function resetInfraVisuals() {
  simulationGeneration++;
  clearAllActiveTimeouts();

  // Remove transient external probes from a previous run.
  svg.querySelectorAll('.attack-entry, .attack-entry-head').forEach(el => el.remove());

  // Remove active wire packets and impact bursts
  const packets = svg.querySelectorAll('.wire-packet');
  packets.forEach(p => p.remove());

  const bursts = nodesLayer.querySelectorAll('.impact-burst');
  bursts.forEach(b => b.remove());

  // Reset node DOM and data states
  currentNodes.forEach(node => {
    node.hit = false;
    node.defended = false;
    if (node.el) {
      node.el.className = 'node';
      node.el.title = node.vulnerabilityAssigned === false ? 'No exploitable exposure assigned in this simulated infrastructure.' : (node.targetDef.publicExposure && `${node.targetDef.attackTechnique} · ${node.targetDef.attackDescription}\n${node.targetDef.publicExposure}`) || (node.kev
        ? 'Simulated CVE mapping: an affected version and configuration are assumed.'
        : node.targetDef.vulnerabilityChance != null
          ? 'No vulnerability assigned to this control in this infrastructure.'
          : 'Simulated MITRE ATT&CK T1078: the attacker uses assumed compromised account credentials. No CVE is assigned.');
      const kevEl = node.el.querySelector('.node-kev');
      if (kevEl) {
        kevEl.innerHTML = `
          <span class="cve">${node.kev ? node.kev.id : node.targetDef.publicExposure ? node.targetDef.attackTechnique : 'T1078 · VALID ACCOUNTS'}</span>
          <span class="vuln-title">${node.kev ? node.kev.title : node.targetDef.publicExposure ? `${node.targetDef.attackDescription} · public access misconfiguration` : 'Assumed compromised credentials'}</span>
        `;
      }
    }
  });

  // Reset wire DOM and data states
  currentWires.forEach(wire => {
    wire.hit = false;
    wire.defended = false;
    wire.path.setAttribute('class', 'wire');
  });

  runStats = { hits: 0, blocks: 0, lakesBreached: 0, publicExposures: 0, wafBlocks: 0, soarBlocks: 0, canaryBlocks: 0 };
  inFlightOperations = 0;
  layerHits = [0, 0, 0, 0];
  isSimulating = false;
}

function triggerNodeHit(node, isExfil = false) {
  if (node.hit || node.defended) return;
  node.hit = true;
  if (node.targetDef.publicExposure) runStats.publicExposures++;
  else runStats.hits++;

  const activeKev = node.kev;

  if (node.el) {
    node.el.classList.add('hit');
    if (isExfil || node.isLake || node.isDb) {
      node.el.classList.add('breach-target');
      runStats.lakesBreached++;
    }

    const kevEl = node.el.querySelector('.node-kev');
    if (kevEl) {
      kevEl.innerHTML = `
        <span class="cve">${activeKev ? activeKev.id : node.targetDef.publicExposure ? node.targetDef.attackTechnique : 'T1078 · VALID ACCOUNTS'}</span>
        <span class="vuln-title">${activeKev ? activeKev.title : node.targetDef.publicExposure ? `${node.targetDef.attackDescription} · public access misconfiguration` : 'Assumed compromised credentials'}</span>
      `;
    }

    const burst = document.createElement('div');
    burst.className = 'impact-burst';
    burst.style.left = `${node.x}px`;
    burst.style.top = `${node.y}px`;
    nodesLayer.appendChild(burst);
    safeTimeout(() => burst.remove(), 700);
  }
}

function triggerNodeDefense(node, wire, mitigation) {
  if (node.hit || node.defended) return;
  node.defended = true;
  if (mitigation.noAssignedVulnerability) return;
  runStats.blocks++;
  if (mitigation.badge?.includes('WAF VIRTUAL PATCH')) runStats.wafBlocks++;
  else if (mitigation.badge?.includes('AGENTIC SOAR')) runStats.soarBlocks++;
  else if (mitigation.badge?.includes('CANARY')) runStats.canaryBlocks++;

  if (node.el) {
    node.el.classList.add('defended');
    const badgeText = mitigation.badge || 'CONTAINED';
    const targetText = node.kev ? node.kev.id : node.targetDef.publicExposure ? `${node.targetDef.attackTechnique} · PUBLIC ACCESS` : mitigation.noAssignedVulnerability ? 'NO EXPLOIT MODELED' : 'T1078 · VALID ACCOUNTS';
    const subText = mitigation.control ? `${targetText} · [${mitigation.control}]` : `Mitigated ${targetText}`;
    node.el.setAttribute('title', `${badgeText}\n${mitigation.reason || ''}`);
    const kevEl = node.el.querySelector('.node-kev');
    if (kevEl) {
      kevEl.innerHTML = `<span class="cve">${badgeText}</span><span class="vuln-title">${subText}</span>`;
    }
  }

  if (wire) {
    wire.defended = true;
    wire.path.classList.add('defended-wire');
  }
}

function animateWirePulse(wire, onComplete) {
  const generation = simulationGeneration;
  const pulse = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  pulse.setAttribute('r', '3.5');
  pulse.setAttribute('class', 'wire-packet');
  svg.appendChild(pulse);

  wire.path.classList.add('active-wire');

  const pathEl = wire.path;
  const duration = 450;
  const startTime = performance.now();

  function step(time) {
    if (generation !== simulationGeneration) return;
    const elapsed = time - startTime;
    const progress = Math.min(1, elapsed / duration);
    const point = pathEl.getPointAtLength(progress * pathEl.getTotalLength());

    pulse.setAttribute('cx', point.x);
    pulse.setAttribute('cy', point.y);

    if (progress < 1) {
      requestAnimationFrame(step);
    } else {
      pulse.remove();
      wire.path.classList.remove('active-wire');
      if (onComplete) onComplete();
    }
  }

  requestAnimationFrame(step);
}

function hasBaselineDataPath() {
  // Use the same probe order and three-hit cap as the baseline, without
  // revealing which assets are vulnerable when paths are prioritized.
  function hasTopologyPath(node) {
    return node.layerIdx === 3 || (attackChoices.get(node.id) || []).some(wire => hasTopologyPath(wire.target));
  }
  const reached = [[], [], [], []];
  const seen = new Set();
  function visit(node) {
    if (seen.has(node.id) || checkVulnMitigation(node.kev && node.kev.id, 'baseline', node).addressed) return;
    if (reached[node.layerIdx].length >= 3) return;
    seen.add(node.id);
    reached[node.layerIdx].push(node);
  }
  const starts = savedAttackOrigins.map(id => currentNodes.find(node => node.id === id)).filter(Boolean);
  starts.sort((a, b) => Number(hasTopologyPath(b)) - Number(hasTopologyPath(a))).forEach(visit);
  for (let layer = 0; layer < 3; layer++) {
    reached[layer].sort((a, b) => Number(hasTopologyPath(b)) - Number(hasTopologyPath(a))).forEach(source => {
      [...(attackChoices.get(source.id) || [])].sort((a, b) => Number(hasTopologyPath(b.target)) - Number(hasTopologyPath(a.target))).forEach(wire => visit(wire.target));
    });
  }
  return reached[3].length > 0;
}

/**
 * Builds a fresh randomized infrastructure topology and runs the simulation.
 */
function generateNewInfra() {
  clearAllActiveTimeouts();
  soarSeed = Math.floor(Math.random() * 4294967296);
  // Generate a meaningful demonstration: resample independent exposures until
  // at least one existing attack path reaches a data target in baseline.
  let attempts = 0;
  do {
    layoutGraph();
    savedAttackOrigins = shuffle(currentNodes.filter(node => EXTERNAL_ENTRY_GROUPS.has(node.groupId))).map(node => node.id);
    attackChoices = new Map(currentNodes.map(node => [node.id,
      shuffle(currentWires.filter(wire => wire.source.id === node.id))
    ]));
    attempts++;
  } while (!hasBaselineDataPath() && attempts < 100);
  if (!hasBaselineDataPath()) throw new Error('Unable to generate a baseline path to a data target');
  const h = window.innerHeight;
  const graphTop = Math.min(h * 0.4, document.querySelector('.top-bar').getBoundingClientRect().bottom + 65);
  const graphHeight = Math.max(graphTop + 1, h - 65) - graphTop;
  savedInfra = {
    soarSeed,
    nodes: currentNodes.map(({ el, x, y, downstream, hit, defended, ...node }) => ({ ...node, x: x / window.innerWidth, y: (y - graphTop) / graphHeight })),
    wires: currentWires.map(wire => [wire.source.id, wire.target.id]),
    origins: savedAttackOrigins,
    choices: Array.from(attackChoices, ([id, wires]) => [id, wires.map(wire => wire.target.id)])
  };
  try { localStorage.setItem(INFRA_STORAGE_KEY, JSON.stringify(savedInfra)); } catch (error) { console.warn('Unable to save infrastructure', error); }
  runSimulationOnCurrentInfra();
}

function restoreInfra(snapshot) {
  if (!snapshot || !Array.isArray(snapshot.nodes) || !Array.isArray(snapshot.wires) || !Array.isArray(snapshot.origins) || !Array.isArray(snapshot.choices)) throw new Error('Invalid saved infrastructure');
  // Keep the same per-node detection outcomes when scenarios are compared.
  if (!Number.isInteger(snapshot.soarSeed)) {
    snapshot.soarSeed = Math.floor(Math.random() * 4294967296);
    try { localStorage.setItem(INFRA_STORAGE_KEY, JSON.stringify(snapshot)); } catch (error) { console.warn('Unable to save simulation seed', error); }
  }
  soarSeed = snapshot.soarSeed;
  // Refresh catalog metadata on previously saved nodes without changing topology.
  snapshot.nodes.forEach(node => {
    const definition = LAYER_CONFIG[node.layerIdx]?.clusters.flatMap(cluster => cluster.targets).find(target => target.id === node.groupId);
    const variant = Number(node.id.slice(node.id.lastIndexOf('-') + 1)) - 1;
    if (!definition || !definition.variants[variant]) return;
    // Older saved controls retain their original products until New Infra.
    if (definition.productPool && !node.targetDef?.productPool) return;
    node.label = definition.variants[variant];
    node.targetDef = definition;
    const kevId = definition.kevByVariant?.[variant];
    if (definition.vulnerabilityChance != null && node.vulnerabilityAssigned == null) node.vulnerabilityAssigned = false;
    node.kev = kevId && (definition.vulnerabilityChance == null || node.vulnerabilityAssigned) ? LAYER_KEVS[node.layerIdx].find(kev => kev.id === kevId) || null : null;
  });
  clearAllActiveTimeouts();
  layoutGraph(snapshot);
  // Upgrade older saved infrastructure without changing its nodes or connections.
  savedAttackOrigins = [...snapshot.origins, ...currentNodes
    .filter(node => EXTERNAL_ENTRY_GROUPS.has(node.groupId) && !snapshot.origins.includes(node.id))
    .map(node => node.id)];
  attackChoices = new Map(snapshot.choices.map(([id, targets]) => [id,
    targets.map(target => currentWires.find(wire => wire.source.id === id && wire.target.id === target)).filter(Boolean)
  ]));
  currentNodes.forEach(node => {
    const choices = attackChoices.get(node.id) || [];
    attackChoices.set(node.id, [...choices, ...currentWires.filter(wire => wire.source.id === node.id && !choices.includes(wire))]);
  });
  savedInfra = snapshot;
  runSimulationOnCurrentInfra();
}

/**
 * Runs the simulation on the CURRENT infrastructure and SAME assigned vulnerabilities.
 */
function runSimulationOnCurrentInfra() {
  resetInfraVisuals();
  isSimulating = true;
  window.isSimulating = true;
  runCount++;
  window.runCount = runCount;

  const scn = DEFENSE_SCENARIOS[currentMode] || DEFENSE_SCENARIOS.baseline;
  runHud.className = '';
  runHud.textContent = `[${scn.tag}] RUN #${String(runCount).padStart(2, '0')} · SIMULATING ON SAME INFRA...`;

  const startNodes = savedAttackOrigins
    .map(id => currentNodes.find(n => n.id === id))
    .filter(Boolean);

  // Build the complete result synchronously in a stable order. Animation cannot
  // affect the outcome, and all scenarios use the same chosen attack paths.
  // Place at most one canary on a route that can pass the same WAF and SOAR
  // rules used by all other attacks. A canary is triggered in half of eligible runs.
  function findCanaryPath(node, path = []) {
    if (checkVulnMitigation(node.kev && node.kev.id, 'baseline', node).addressed) return null;
    const nextPath = [...path, node];
    if (node.layerIdx === 3) return nextPath;
    if (checkVulnMitigation(node.kev && node.kev.id, 'combined', node).addressed) return null;
    const preferred = attackChoices.get(node.id) || [];
    const candidates = [...preferred, ...currentWires.filter(wire => wire.source.id === node.id && !preferred.includes(wire))];
    for (const wire of candidates) {
      const found = findCanaryPath(wire.target, nextPath);
      if (found) return found;
    }
    return node.layerIdx === 2 && !checkVulnMitigation(node.kev && node.kev.id, 'combined', node).addressed ? nextPath : null;
  }
  const viablePath = startNodes.map(node => findCanaryPath(node)).find(Boolean);
  // Keep this route in the shared attack choices for every scenario.
  if (viablePath) viablePath.slice(0, -1).forEach((node, index) => {
    const wire = currentWires.find(candidate => candidate.source.id === node.id && candidate.target.id === viablePath[index + 1].id);
    const choices = attackChoices.get(node.id) || [];
    if (wire && !choices.includes(wire)) attackChoices.set(node.id, [...choices, wire]);
  });
  const canaryPath = currentMode === 'combined' && Math.random() < 0.5 ? viablePath : null;
  const canaryTarget = canaryPath?.[canaryPath.length - 1];
  const canaryApproach = new Set((canaryPath || []).slice(0, -1).map(node => node.id));
  // Check every perimeter object first, then advance layer by layer. Keep
  // probes on real connections: baseline permits at most three hits per
  // layer; defended scenarios permit at most one backend data target hit.
  function hasRouteToData(node) {
    if (node.layerIdx === 3) return true;
    return (attackChoices.get(node.id) || []).some(wire => hasRouteToData(wire.target));
  }
  function priority(node) {
    return (canaryApproach.has(node.id) || node === canaryTarget ? 2 : 0) + (hasRouteToData(node) ? 1 : 0);
  }
  const orderedStarts = [...startNodes].sort((a, b) => priority(b) - priority(a));
  const visited = new Map();
  const reached = [[], [], [], []];
  const batches = [];
  let dataReached = false;

  function planBatch(probes) {
    const events = [];
    for (const { node, wire } of probes) {
      if (visited.has(node.id)) {
        if (wire) events.push({ node, wire, mitigation: visited.get(node.id), revisit: true });
        continue;
      }
      let mitigation = checkVulnMitigation(node.kev && node.kev.id, currentMode, node);
      if (node === canaryTarget) {
        mitigation = { addressed: true, badge: 'BLOCKED · CANARY TRIGGER', control: 'NIST SI-4', reason: 'The simulated attack chain reached the canary and was blocked.' };
      }
      const hitLimit = currentMode === 'baseline' ? 3 : node.layerIdx === 3 ? 1 : Infinity;
      if (!mitigation.addressed && reached[node.layerIdx].length >= hitLimit) {
        events.push({ node, wire, mitigation, probeOnly: true });
        continue;
      }
      visited.set(node.id, mitigation);
      events.push({ node, wire, mitigation });
      if (node.layerIdx === 3 && !mitigation.noAssignedVulnerability) dataReached = true;
      if (!mitigation.addressed) reached[node.layerIdx].push(node);
    }
    if (events.length) batches.push(events);
  }

  for (let i = 0; i < orderedStarts.length; i += 3) {
    planBatch(orderedStarts.slice(i, i + 3).map(node => ({ node, wire: null })));
  }
  for (let layer = 0; layer < 3; layer++) {
    const sources = [...reached[layer]].sort((a, b) => priority(b) - priority(a));
    for (const source of sources) {
      const wires = [...(attackChoices.get(source.id) || [])].sort((a, b) => priority(b.target) - priority(a.target));
      for (let i = 0; i < wires.length; i += 3) {
        planBatch(wires.slice(i, i + 3).map(wire => ({ node: wire.target, wire })));
      }
    }
  }

  function playBatch(index) {
    if (index >= batches.length) { finalizeSimulation(dataReached); return; }
    const batch = batches[index];
    let remaining = batch.length;
    const complete = () => { if (--remaining === 0) safeTimeout(() => playBatch(index + 1), 150); };
    batch.forEach(({ node, wire, mitigation, revisit, probeOnly }) => {
      const apply = () => {
        if (probeOnly) { complete(); return; }
        if (mitigation.addressed) {
          if (revisit && !mitigation.noAssignedVulnerability) { wire.defended = true; wire.path.classList.add('defended-wire'); }
          else if (!revisit) triggerNodeDefense(node, wire, mitigation);
        } else {
          if (wire) { wire.hit = true; wire.path.classList.add('hit-wire'); }
          if (!revisit) {
            triggerNodeHit(node, node.layerIdx === 3);
            if (!node.kev && !node.targetDef.publicExposure && wire && node.el) {
              node.el.title = `Assumed credential reuse from ${wire.source.label} to ${node.label} (MITRE ATT&CK T1078).`;
              const detail = node.el.querySelector('.node-kev .vuln-title');
              if (detail) detail.textContent = `Assumed credentials from ${wire.source.label}`;
            }
          }
        }
        complete();
      };
      if (wire) animateWirePulse(wire, apply);
      else {
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        line.setAttribute('class', 'attack-entry');
        line.setAttribute('d', `M -20 ${node.y} L ${Math.max(8, node.x - 24)} ${node.y}`);
        svg.appendChild(line);
        safeTimeout(() => line.remove(), 750);
        safeTimeout(apply, 650);
      }
    });
  }
  playBatch(0);
}

function finalizeSimulation(dataReached = false) {
  isSimulating = false;
  window.isSimulating = false;
  window.runStats = runStats;
  const scn = DEFENSE_SCENARIOS[currentMode] || DEFENSE_SCENARIOS.baseline;
  if (runStats.lakesBreached > 0) {
    runHud.className = 'breached';
    runHud.textContent = `[${scn.tag}] RUN #${String(runCount).padStart(2, '0')} · ${runStats.hits} NODES COMPROMISED · ${runStats.blocks} CONTAINED · DATA TARGET REACHED`;
  } else {
    runHud.className = 'contained';
    runHud.textContent = `[${scn.tag}] RUN #${String(runCount).padStart(2, '0')} · ${runStats.hits} NODES COMPROMISED · ${runStats.blocks} CONTAINED · ${dataReached ? 'DATA LAYER REACHED · BLOCKED' : 'DATA LAYER NOT REACHED'}`;
  }

  if (runStats.publicExposures) runHud.textContent += ` · ${runStats.publicExposures} PUBLIC EXPOSURES`;
  if (currentMode === 'combined') {
    runHud.textContent += ` · WAF ${runStats.wafBlocks} / SOAR ${runStats.soarBlocks} / CANARY ${runStats.canaryBlocks}`;
  }

  if (window._onSimulationDone) {
    window._onSimulationDone({
      run: runCount,
      scenario: currentMode,
      hits: runStats.hits,
      blocks: runStats.blocks,
      publicExposures: runStats.publicExposures,
      wafBlocks: runStats.wafBlocks,
      soarBlocks: runStats.soarBlocks,
      canaryBlocks: runStats.canaryBlocks,
      lakesBreached: runStats.lakesBreached,
      status: runStats.lakesBreached > 0 ? 'BREACHED' : 'CONTAINED'
    });
  }
}

// Bind 4 mode scenario buttons: tests the SAME infrastructure with SAME vulns
const modeButtons = document.querySelectorAll('.mode-btn');
modeButtons.forEach(btn => {
  btn.addEventListener('click', () => {
    currentMode = btn.dataset.mode;
    try { localStorage.setItem('artex-wire-mode', currentMode); } catch (error) { console.warn('Unable to save scenario', error); }
    modeButtons.forEach(b => b.classList.toggle('selected', b === btn));
    runSimulationOnCurrentInfra();
  });
});

// "NEW INFRA" generates a fresh infrastructure layout
newRunBtn.addEventListener('click', () => {
  generateNewInfra();
});

window.addEventListener('resize', () => {
  if (savedInfra) restoreInfra(savedInfra);
});

window.addEventListener('load', () => {
  try {
    const mode = localStorage.getItem('artex-wire-mode');
    if (mode && DEFENSE_SCENARIOS[mode]) {
      currentMode = mode;
      modeButtons.forEach(btn => btn.classList.toggle('selected', btn.dataset.mode === mode));
    }
    const snapshot = JSON.parse(localStorage.getItem(INFRA_STORAGE_KEY));
    if (snapshot) { restoreInfra(snapshot); return; }
  } catch (error) { console.warn('Unable to restore infrastructure', error); }
  generateNewInfra();
});
</script>
</body>
</html>
